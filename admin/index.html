<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Panel</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; background: #F4F7FA; color: #0B1F33; }
    section { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
    h2 { margin: 0; }
    input, textarea, button { padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #8A9BAD; }
    button { background: #0B7A6E; color: #fff; border: 0; cursor: pointer; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid #E1E8EF; }
    .row button { background: #B3261E; padding: 8px 14px; }
  </style>
</head>
<body>
  <h1>Admin Panel — Views: <span id="views">0</span></h1>

  <section>
    <h2>Nayi service</h2>
    <input id="st" placeholder="Service ka naam">
    <textarea id="sx" rows="3" placeholder="Details"></textarea>
    <button id="addS">Add karein</button>
  </section>

  <section>
    <h2>Image ya Video upload</h2>
    <input id="cap" placeholder="Caption (optional)">
    <input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm">
    <button id="addM">Upload karein</button>
  </section>

  <section><h2>Services</h2><div id="sl"></div></section>
  <section><h2>Media</h2><div id="ml"></div></section>

  <script>
    const $ = id => document.getElementById(id);
    async function api(url, opt) {
      const r = await fetch(url, opt);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    function fill(box, items, label, url) {
      box.replaceChildren();
      items.forEach(it => {
        const row = document.createElement("div"); row.className = "row";
        const t = document.createElement("span"); t.textContent = label(it);
        const b = document.createElement("button"); b.textContent = "Delete";
        b.onclick = async () => {
          if (confirm("Delete karna hai?")) { await api(url + it.id, { method: "DELETE" }); refresh(); }
        };
        row.append(t, b); box.append(row);
      });
    }
    async function refresh() {
      const d = await api("/api/content");
      $("views").textContent = (await api("/api/views")).views;
      fill($("sl"), d.services, s => s.title, "/api/services/");
      fill($("ml"), d.media, m => m.type + ": " + (m.caption || m.file), "/api/media/");
    }
    $("addS").onclick = async () => {
      try {
        await api("/api/services", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: $("st").value, text: $("sx").value }) });
        $("st").value = ""; $("sx").value = ""; refresh();
      } catch (e) { alert(e.message); }
    };
    $("addM").onclick = async () => {
      const f = $("file").files[0];
      if (!f) return alert("Pehle file chunein");
      const fd = new FormData();
      fd.append("caption", $("cap").value);
      fd.append("file", f);
      try { await api("/api/media", { method: "POST", body: fd }); $("cap").value = ""; $("file").value = ""; refresh(); }
      catch (e) { alert(e.message); }
    };
    refresh();
  </script>
</body>
</html>
